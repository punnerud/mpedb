[package]
name = "mpedb-mirror"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bidirectional sqlite3/PostgreSQL <-> mpedb mirror (design/DESIGN-MIRROR.md)"

[features]
oracle-source = ["dep:oracle-client"]

[dependencies]
mpedb = { workspace = true }
mpedb-core = { workspace = true }
mpedb-types = { workspace = true }
# xxh3 for the CDC dirty-key hash, matching mpedb-core.
xxhash-rust = { workspace = true }
# Source adapters: sqlite via rusqlite (bundled 3.45, proven in mpedb-bench),
# PostgreSQL via the sync postgres client.
rusqlite = { version = "0.31", features = ["bundled"] }
postgres = "0.19"
# Public OCI client API only; Oracle engine remains a black-box dependency.
oracle-client = { package = "oracle", version = "0.6.3", optional = true }
# §12 credential channel: 0600 TOML source-config + geteuid ownership check.
toml = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
mpedb-testkit = { path = "../mpedb-testkit" }
mpedb-proc = { path = "../mpedb-proc" }
