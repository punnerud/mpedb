[package]
name = "mpedb-py"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Python bindings for mpedb (CPython 3.10+, abi3)"

[lib]
# The cdylib is named libmpedb_py.so; rename/copy it to `mpedb.so` (or build
# with maturin) to import it — the #[pymodule] itself is named `mpedb`.
name = "mpedb_py"
crate-type = ["cdylib"]

[dependencies]
# `sqlite-checkpoint`: the `.db` routing (a sqlite file as base, mpedb as the
# delta) needs the overlay's checkpoint push — `Connection.commit()` on a `.db`
# path IS that checkpoint, which is what keeps the base in sync.
mpedb = { workspace = true, features = ["sqlite-checkpoint"] }
# Same rusqlite the overlay's checkpoint already compiles (shared build): used
# ONLY to create a missing `.db` base properly (sqlite3.connect's semantics).
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
# pyo3 is deliberately NOT a workspace dependency: only this crate binds Python.
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py310", "chrono"] }
