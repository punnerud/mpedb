[package]
name = "mpedb-sqlitefmt"
version = "0.3.1"
edition = "2021"

# Dependency-light BY DESIGN: this is the native sqlite-file READER
# (DESIGN-SQLITE-BACKED §4) — the v2 overlay's fall-through reads run under
# mpedb's own lock protocol with no sqlite library in the path, so nothing
# here may drag one in. The library is what VERIFIES us, in dev-deps only.
[dependencies]

# fcntl byte-range locks (sqlite's own) — no higher-level dep warranted.
# Unix ONLY: the Windows arm hand-declares LockFileEx/UnlockFileEx, and #159's
# lesson is that no `libc` may survive in a Windows build — its `-gnu` surface
# carries POSIX names that `-msvc` does not, so a Linux cross-check cannot see
# the difference and CI fails to COMPILE.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
# A DEV-dependency cycle (testkit -> mpedb -> this crate), which Cargo permits
# precisely because it cannot affect the build graph of the library itself.
# Worth it for the one thing it buys: every test in the workspace putting its
# scratch files where MPEDB_TEST_DIR says, instead of on the root filesystem.
mpedb-testkit = { path = "../mpedb-testkit" }
