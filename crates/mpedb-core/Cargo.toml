[package]
name = "mpedb-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "mpedb storage engine: shared-memory COW B+tree with MVCC snapshots"

[features]
# expose the in-memory TestStore to downstream crates' tests
teststore = []
# count the alloc/refill/commit branches for the #37 high-water leak. Off by
# default: it puts an atomic increment on the page-allocation path.
leakstat = []
# wasm32: read the wall clock through js-sys (Date.now()) instead of the
# hand-rolled `mpedb` host import. For wasm-bindgen embedders, whose
# generated glue only populates the `wbg` import module and cannot supply
# `{ mpedb: { mpedb_host_now_ms } }`. Off by default: the hand-rolled ABI
# (web/mpedb.js) keeps working unchanged.
js-clock = ["dep:js-sys", "dep:wasmtimer"]

[dependencies]
mpedb-types = { workspace = true }
libc = { workspace = true }
xxhash-rust = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3", optional = true }
wasmtimer = { version = "0.4", optional = true }

[dev-dependencies]
mpedb-testkit = { path = "../mpedb-testkit" }
