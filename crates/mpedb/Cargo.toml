[package]
name = "mpedb"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Embedded multi-process shared-memory database with SQL and content-hashed plans"

[features]
# forward mpedb-core's #37 leak counters; `examples/leak_probe` dumps them
leakstat = ["mpedb-core/leakstat"]
# forward mpedb-core's wasm-bindgen-friendly clock (see mpedb-core/Cargo.toml)
js-clock = ["mpedb-core/js-clock"]
# Forwards `mpedb-sql/pg-dialect`. Exists so the CI matrix can run the SQLITE
# gates with the PostgreSQL surface compiled IN — the proof that the surface is
# inert, which is the whole claim the build toggle makes. Nothing enables it by
# default, and no member of the parent workspace enables it at all, so the
# feature-unification trap the root Cargo.toml warns about cannot spring.
pg-dialect = ["mpedb-sql/pg-dialect"]
# the sqlite-backed overlay's checkpoint push (DESIGN-SQLITE-BACKED §5): the
# sqlite LIBRARY is the base writer, so this pulls in rusqlite. The CLI
# enables it; library users opt in.
sqlite-checkpoint = ["dep:rusqlite"]

[dev-dependencies]
mpedb-testkit = { path = "../mpedb-testkit" }
# "functions" lets the differential oracle register a Rust closure as the
# consumer's `regexp()` UDF — the contract behind sqlite's REGEXP operator
# (tests/regexp.rs; the bare library has no regexp() of its own).
rusqlite = { version = "0.31", features = ["bundled", "functions"] }

[dependencies]
# The join gather's budget_fits_in_memory rlimit probe. Already in the tree
# via mpedb-core.
libc = { workspace = true }
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
mpedb-sqlitefmt = { path = "../mpedb-sqlitefmt" }
mpedb-types = { workspace = true }
mpedb-core = { workspace = true }
mpedb-sql = { workspace = true }
# The advisor's index identity is the #118 §2.2 content hash — the same blake3
# the schema hash already uses one crate down.
blake3 = { workspace = true }
toml = { workspace = true }
# The stored-SQL-function pipeline (stage M2): compile at create_function,
# interpret at call — database-free by construction (the crate depends only
# on mpedb-types).
mpedb-spell = { workspace = true }
