# Remote access to mpedb's PostgreSQL wire socket, with TLS terminated here.
#
# Goes in a file included from nginx.conf's `stream { }` block (Debian:
# /etc/nginx/streams-enabled/, with `include /etc/nginx/streams-enabled/*;`
# inside `stream { }` — note that the stock nginx.conf includes only
# `sites-enabled` under `http`, so the stream include has to be added once).

upstream mpedb {
    # The unix socket systemd is listening on. nginx connects to it exactly as
    # a local psql would.
    server unix:/run/mpedb/.s.PGSQL.5432;
}

server {
    listen 5432 ssl;

    # mpedb-pg answers PostgreSQL's SSLRequest with `N` — it does not do TLS
    # itself, on purpose: a process spawned per connection has no business
    # holding a private key. The client's TLS ends HERE, and the hop from nginx
    # to the socket is a local unix socket with 0660 permissions.
    ssl_certificate     /etc/ssl/certs/mpedb.crt;
    ssl_certificate_key /etc/ssl/private/mpedb.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    proxy_pass mpedb;

    # A PostgreSQL connection is long-lived and mostly idle; the default 10m
    # would drop a session that is simply waiting for the next query.
    proxy_timeout 1h;
    proxy_connect_timeout 5s;
}
