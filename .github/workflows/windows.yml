# Windows — two jobs, because they guarantee two different things.
#
# `windows-portable-core` is a SETTLED guarantee: `mpedb-types` (values, schema
# + canonical bytes + blake3, memcmp key encoding, the expression IR with SQL
# 3VL, plan footprints) and `mpedb-sql` (tokenizer → AST → binder → planner →
# plan encode/decode/validate) have zero Unix dependencies and must never
# silently acquire one. ~320 tests. Red here fails the run and always should.
#
# `windows-engine` is a PORT IN PROGRESS (#159). Keeping them apart is the
# point: a gap in an unfinished stage must not read as an SQL front-end
# regression.
#
# The engine WAS Unix-only by construction — MAP_SHARED mmap, flock/fcntl,
# robust PROCESS_SHARED pthread mutexes, `/proc/<pid>/stat` reader identity,
# msync/fdatasync ordering. What made the port tractable is that the seam
# already existed for macOS and wasm32: `crates/mpedb-core/src/os.rs` plus a
# `wincompat` module supplying the Unix-shaped names over real Win32 calls, so
# the call sites compile unchanged. See design/DESIGN-WINDOWS.md.
name: Windows

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
jobs:
  windows-portable-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: toolchain
        run: rustc --version; cargo --version; cargo clippy --version
      - name: test the portable crates
        run: cargo test -p mpedb-types -p mpedb-sql
      - name: clippy the portable crates
        run: cargo clippy -p mpedb-types -p mpedb-sql --all-targets -- -D warnings

  # ---------------------------------------------------------------------
  # #159 stages 1-4: the ENGINE on real Windows.
  #
  # Stage 1 = one process opens a `.mpedb`, reads and writes (`--lib`).
  # Stage 2 = several processes on one file: mapping coherence, writer
  # exclusion, MVCC snapshots across processes, owner death
  # (`--test multiproc_attach`). That test is deliberately fork-free — it
  # re-invokes this same binary via `std::process` and kills it with
  # `Child::kill`, which is `TerminateProcess` here and `SIGKILL` on Unix.
  #
  # This is the job that DECIDES. Wine (`scripts/test-windows-wine.sh`) screens
  # locally and has earned more trust than expected — it found the TOML
  # path-escape bug and drove both stages green — but it EMULATES precisely the
  # primitives these stages rest on, so it cannot be the verdict.
  #
  # Stage 3 = durability and recovery, plus the facade's own suite. The two
  # `multiproc_attach` durability arms kill a writer at `durability = commit`
  # and `= wal` and then have a THIRD process reopen the file, so the
  # all-or-nothing answer comes from the disk and the log rather than a mapping
  # that happened to survive.
  #
  # `sqlite3` is installed because ONE differential test needs it and cannot be
  # made not to: `regexp()` lives in `ext/misc/regexp.c`, which is compiled into
  # sqlite's SHELL and not its library, so the bundled rusqlite oracle every
  # other differential uses cannot answer a REGEXP query at all. Skipping those
  # three tests here would have been cheaper and would have meant Windows never
  # cross-checks the REGEXP surface.
  #
  # Stage 4 is the crash harnesses themselves, and they are NOT `fork`-bound —
  # `mpedb-cli` contains no `fork` at all (see DESIGN-WINDOWS §2's correction).
  # All six run here. `collide` was held back while #160 was open — it failed on
  # LINUX too, on the tagged v0.1.4 and on v0.1.3 before it, so running it would
  # have pinned a known corruption as the Windows job's verdict rather than the
  # platform's. #160 is fixed, so it is in, and it is in at `--durability commit`
  # because that is the arm that reproduced: the ring only leads a batch when
  # commits are durable, and the batch is what makes the leader's transaction
  # dirty before a failing statement runs.
  #
  # Kept short on purpose: these are minutes-scale by nature, and this job runs
  # nightly. The point is that the mechanism works there, not to out-soak the
  # Linux box.
  windows-engine:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: toolchain
        run: rustc --version; cargo --version
      - name: build the engine for Windows
        run: cargo build -p mpedb-core
      - name: stage 1 — engine unit tests (single-process)
        run: cargo test -p mpedb-core --lib
      - name: stage 2 — multi-process attach
        run: cargo test -p mpedb-core --test multiproc_attach
      # The other shape, and the one nothing covered: several THREADS of one
      # process through one mapping. Every multi-process test gets each side its
      # own file handle; this one does not, and on Windows the writer lock's
      # intra-process exclusion rests entirely on `LockFileEx` over a SHARED
      # handle. That was a claim in a comment until #165 (and it holds).
      - name: stage 2b — writer threads inside one process
        run: cargo test -p mpedb-core --test threads_one_process
      - name: the differential oracle's one shell dependency
        run: choco install sqlite -y --no-progress
      # `-p mpedb-testkit` carries the curated sqllogictest files AND the
      # differential tester — the bundled sqlite answering the same generated
      # program in-process. Without it "the SQL surface is differentially
      # checked on all three platforms" was a claim about two of them. It costs
      # under a second of test time; the compile was already paid, since
      # `-p mpedb`'s dev-deps pull the same bundled sqlite.
      - name: stage 3 — integration tests, the facade suite, and the differential
        run: cargo test -p mpedb-core -p mpedb -p mpedb-testkit --lib --tests
      - name: stage 4 — the crash harnesses
        shell: bash
        run: |
          set -e
          cargo build -p mpedb-cli
          B=target/debug/mpedb.exe
          run() { d=$(mktemp -d); echo "--- $*"; "$B" "$@" --dir "$d"; rm -rf "$d"; }
          run crash --waves 3 --children 4
          run stress --workers 4 --secs 8 --mode mixed
          run powerloss --rounds 3 --workers 2 --durability wal
          run powerloss --rounds 2 --workers 2 --durability async
          run queue-collide --secs 8
          run mirror-collide --mode pull --writers 2 --secs 8
          run collide --writers 4 --total 400 --drop-rate 0 --durability commit
          run collide --writers 4 --total 400 --durability wal
          d=$(mktemp -d); "$B" tier crash --dir "$d" --waves 2; rm -rf "$d"
      # The CLI is a product surface, not a test harness, and building it is
      # not the same as it working: `mpedb <path> "SQL"` creates the file on
      # first write, and every step below goes through the path handling that
      # #159 found four wrong spellings of.
      - name: stage 5 — the CLI end to end
        shell: bash
        run: |
          set -e
          B=target/debug/mpedb.exe
          d=$(mktemp -d); f="$d/app.mpedb"
          "$B" "$f" "CREATE TABLE t (id INTEGER PRIMARY KEY, s TEXT)"
          "$B" "$f" "INSERT INTO t (id, s) VALUES (1, 'a')"
          "$B" "$f" "INSERT INTO t (id, s) VALUES (2, 'b')"
          # `tail -1`: the CLI prints a header row first. And `! grep -q`
          # below, not `grep -qv` — the inverted form matches any file with a
          # second line, so it would pass on a dump full of tombstones.
          test "$("$B" "$f" "SELECT count(*) FROM t" | tail -1 | tr -d '\r')" = 2
          "$B" prepare "$f" "SELECT s FROM t WHERE id = ?"
          "$B" dump "$f" | grep -q 'name = "t"'
          "$B" "$f" "DROP TABLE t"
          ! "$B" dump "$f" | grep -q 'name = ""'
          rm -rf "$d"
      - name: clippy the engine
        run: cargo clippy -p mpedb-core --lib -- -D warnings

  # The Python binding is a published wheel (`pip install mpedb`), so "it
  # compiles for Windows" is not the claim that matters — the suite has to run
  # there. It is run TWICE against the same directory, which is its documented
  # mode: that is how it exercises persistence across process restarts, and it
  # is what caught live DDL leaving a table behind (#163).
  windows-python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release -o dist --manifest-path crates/mpedb-py/Cargo.toml
      - name: install the wheel
        shell: bash
        run: pip install --find-links dist --no-index mpedb
      - name: the python suite, twice against one directory
        shell: bash
        run: |
          set -e
          d=$(mktemp -d)
          python crates/mpedb-py/pytest/test_mpedb.py "$d"
          python crates/mpedb-py/pytest/test_mpedb.py "$d"
          python crates/mpedb-py/pytest/test_sync.py "$(mktemp -d)"
