# Linux — the primary gate. Runs on every push to main and every PR: this is the
# platform that catches ~all regressions, and it is the cheap one.
#
# The full engine, including the multi-process stress/crash tests (they need only
# a shared-memory scratch dir, which the runner provides). PostgreSQL-dependent
# mirror tests, soaks and benchmarks are #[ignore]d and deliberately not run.
#
# Exit codes are checked by construction — this repo has committed with clippy red
# because a local pipeline swallowed one.
name: Linux

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A superseded PR run is wasted runner time. A push to main is NOT cancelled:
  # when CI goes red we want to know WHICH commit did it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # Print the toolchain LOUDLY: CI tracks stable, dev boxes lag, and a clippy
      # lint that exists in one and not the other reads as "CI is flaky" when it
      # is really "your box is a release behind" (byte_char_slices, new in 1.97,
      # against a 1.96 dev box).
      - name: toolchain
        run: rustc --version && cargo --version && cargo clippy --version && sqlite3 --version
      # mold is a build ACCELERATOR, opted into here rather than committed in
      # `.cargo/config.toml`: a committed `-fuse-ld=mold` is a hard dependency, and
      # it broke this workflow — the runners have no mold, so every link died with
      # `collect2: fatal error: cannot find 'ld'` before a test ran.
      - name: mold (link accelerator, optional)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mold || true
          if command -v mold >/dev/null; then
            echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"
            echo "mold enabled: $(mold --version)"
          else
            echo "mold unavailable — building with the default linker"
          fi
      # The Windows job guards that the SQL front end and the type system stay
      # portable, but it runs NIGHTLY — so a portable crate that acquires a
      # Unix dependency is green here and red twelve hours later, on a machine
      # nobody is looking at. This is the same property, checked in a second on
      # every push. (#138 added an unused `mpedb-testkit` dev-dependency to
      # mpedb-types, which drags in mpedb → mpedb-core → mmap/flock/libc; the
      # nightly caught it a day later.)
      - name: the portable crates must stay portable
        run: |
          for c in mpedb-types mpedb-sql; do
            if cargo tree -p "$c" --edges normal,build,dev | grep -q mpedb-core; then
              echo "::error::$c reaches mpedb-core, which is Unix-only by construction."
              echo "The Windows job builds $c and will fail. Dependency path:"
              cargo tree -p "$c" --edges normal,build,dev --invert mpedb-core || true
              exit 1
            fi
          done
      # The guard above catches the DEPENDENCY route to mpedb-core and names the
      # path, which is what you need to fix it. It does not catch a direct
      # `use std::os::unix` written into a portable crate, or a third-party dep
      # that is Unix-only on its own. This does: it compiles the exact crates the
      # Windows job compiles, for a Windows target, and reproduces that job's
      # failure verbatim — `cannot find 'unix' in 'os'` — in about ten seconds.
      #
      # `check`/`clippy` do not link, so no MSVC toolchain or mingw is needed;
      # the target's std is the whole requirement. The `-gnu` target is used
      # because `-msvc` needs `ml64.exe` for a dependency's assembly, which does
      # not exist on Linux. That is a real difference from CI's toolchain and it
      # does not matter for the property being guarded: whether OUR code reaches
      # for Unix does not depend on which Windows linker would run afterwards.
      #
      # What this does NOT do is run anything. Windows RUNTIME behaviour is still
      # only covered by the nightly Windows job.
      - name: the portable crates must COMPILE for Windows
        run: |
          rustup target add x86_64-pc-windows-gnu
          cargo clippy -p mpedb-types -p mpedb-sql --all-targets \
            --target x86_64-pc-windows-gnu -- -D warnings
      # The engine now has THREE non-Linux arms (windows, macos, wasm32), and
      # `cargo test --workspace` exercises exactly one of them. That asymmetry
      # already cost: adding the Windows arm as `#[cfg(windows)]` /
      # `#[cfg(not(windows))]` where the original split was on `target_os =
      # "linux"` made both bodies compile on wasm32 — a duplicate-definition
      # error no green Linux run could see, because nothing in the workspace
      # builds for wasm32. Ten seconds of `check` closes it.
      #
      # Windows gets the engine too, not just the portable crates: it is a port
      # in progress (#159) and the compile half of its gate should be as cheap
      # and as early as everything else's.
      #
      # CLIPPY, not just check, for the Windows arm: cfg-gated code is invisible
      # to the lint pass on this host, and the first real-Windows run of the
      # engine job failed on exactly that — three lints in `cfg(windows)` code,
      # after the build and both stages had passed. Same debt macOS accrued in
      # #107. Cross-linting costs seconds and moves the finding from a
      # Windows-runner round trip to the push that caused it.
      #
      # wasm32 stays at `check`: its arm has no lint history and `check` is what
      # catches the failure mode that actually occurred (overlapping cfgs).
      - name: the engine must COMPILE for Windows and wasm32
        run: |
          rustup target add wasm32-unknown-unknown
          # mingw is needed because the facade and the CLI pull `libsqlite3-sys`
          # (the bundled sqlite behind overlay/differential), whose build script
          # compiles C *for the target*. `check`/`clippy` do not link, but a
          # build script still has to run. This passed on my box and failed here
          # for exactly that reason — the dev box already had mingw for Wine.
          sudo apt-get install -y -qq mingw-w64
          # clippy is a HOST component — `rustup component add clippy --target
          # <T>` is an error, not a no-op. Cross-linting needs only the target's
          # std, which the step above already installed.
          # The FACADE and the CLI too, not just the engine: the crash
          # harnesses live in mpedb-cli and the join budget's Windows arm lives
          # in mpedb, and neither is compiled by a `-p mpedb-core` lint. Stage 4
          # found a `mut` that only Windows sees exactly that way.
          cargo clippy -p mpedb-core -p mpedb -p mpedb-cli --lib --bins \
            --target x86_64-pc-windows-gnu -- -D warnings
          cargo check -p mpedb-core --target wasm32-unknown-unknown
      - name: test
        run: cargo test --workspace
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # mpedb-capi is its OWN workspace: it exports sqlite3_* and cannot co-link the
      # bundled sqlite the parent's feature unification pulls in (rust-lld refuses
      # the duplicate symbols outright). Built by manifest path, where mpedb
      # compiles without the sqlite feature at all.
      - name: capi (its own workspace)
        run: |
          cargo test --manifest-path crates/mpedb-capi/Cargo.toml
          cargo clippy --manifest-path crates/mpedb-capi/Cargo.toml --all-targets -- -D warnings
