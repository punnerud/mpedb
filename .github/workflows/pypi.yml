# PyPI publish: when the tests are green on main, the `mpedb` package updates.
#
# Self-contained gate, spent where it pays: the PYTHON suite (the coverage no
# other workflow runs — its second pass against one directory is what caught
# #163) runs on EVERY push; the full workspace + capi + clippy gate and the
# whole wheel fan (including the QEMU-emulated ARM builds, the expensive part)
# run only when crates/mpedb-py/pyproject.toml names a version PyPI does not
# have yet. An ordinary push is a few cached minutes; releasing is exactly
# "bump the version, push, watch it go green". The version probe fails OPEN —
# a PyPI hiccup just means the fan runs and `--skip-existing` discards it at
# upload, which was this workflow's behavior on every push before the gate.

name: pypi

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      new: ${{ steps.check.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        name: is this version already on PyPI?
        run: |
          v=$(grep -m1 '^version = ' crates/mpedb-py/pyproject.toml | cut -d'"' -f2)
          if curl -fs "https://pypi.org/pypi/mpedb/$v/json" > /dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "mpedb $v is already on PyPI — wheel fan skipped"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "mpedb $v is not on PyPI — full gate + wheel fan run"
          fi

  # The binding's OWN suite, every push. The wheel is abi3-py310, so ONE
  # build covers every supported CPython — built once here, then the suite
  # fans out over 3.10..3.13 below (the fan legs are pure-Python, no rust
  # toolchain, ~a minute each). This artifact is NOT published: it is not a
  # manylinux-audited build, and publish deliberately downloads only
  # `wheel-*` + `sdist`.
  pywheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release -o dist --manifest-path crates/mpedb-py/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: pysuite-wheel
          path: dist

  # Run TWICE against one directory — its documented mode, and how it
  # exercises persistence across process restarts (that second run is what
  # caught #163: live DDL leaving a table behind). The matrix floor (3.10)
  # is what backs `requires-python = ">=3.10"`; windows.yml runs the same
  # suite at the floor on its platform.
  pysuite:
    needs: pywheel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: pysuite-wheel
          path: dist
      - name: the python suite, twice against one directory
        run: |
          set -e
          pip install --find-links dist --no-index mpedb
          d=$(mktemp -d)
          python crates/mpedb-py/pytest/test_mpedb.py "$d"
          python crates/mpedb-py/pytest/test_mpedb.py "$d"
          python crates/mpedb-py/pytest/test_sync.py "$(mktemp -d)"

  # The full self-contained publish gate — release pushes only. Ordinary
  # pushes get the same coverage from linux.yml on the same commit; a RELEASE
  # does not lean on that, it re-proves it here before anything uploads.
  test:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: workspace tests
        run: cargo test --workspace
      - name: capi tests (own workspace)
        run: cargo test --manifest-path crates/mpedb-capi/Cargo.toml
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Linux wheels: x86-64 plus the two ARM shapes the engine is actually
  # crash-tested on (aarch64 and 32-bit armv7 — the Raspberry Pi pair).
  # Cross wheels build inside QEMU-emulated manylinux containers — the
  # expensive jobs the version gate exists to skip.
  #
  # The note that used to stand here — "no Windows wheel: the engine is POSIX at
  # its core ... a Windows port is an engine project, not a CI matrix entry" —
  # was true when written and is not any more. #159 ported it: shared
  # `CreateFileMapping` views, a `LockFileEx` writer lock with owner-death
  # release, `GetProcessTimes` reader identity, and all six crash harnesses
  # green on `windows-latest`. The wheel is `wheel-windows` below, and the
  # Python suite runs there in `windows.yml` before this ever builds it.
  wheel-linux:
    needs: [version, pysuite, test]
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64, armv7]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: matrix.target != 'x86_64'
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release -o dist --manifest-path crates/mpedb-py/Cargo.toml
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-${{ matrix.target }}
          path: dist

  wheel-windows:
    needs: [version, pysuite, test]
    if: needs.version.outputs.new == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release -o dist --manifest-path crates/mpedb-py/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-windows
          path: dist

  # Two THIN wheels, each built natively on the hardware it targets — and the
  # exact artifact that uploads is first installed and run through the python
  # suite on that same hardware (the mac twin of windows.yml's gate; Linux
  # gets it from pysuite). arm64 on macos-14; x86-64 on macos-15-intel, the
  # last Intel image GitHub will host (retires Aug 2027) — native-built and
  # suite-run beats a cross-compiled universal2 half nothing ever executed.
  # Python pins mirror the logic elsewhere: the FLOOR (3.10) on Intel, the
  # ceiling on arm — pysuite's Linux matrix owns the versions in between.
  wheel-macos:
    needs: [version, pysuite, test]
    if: needs.version.outputs.new == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            python: "3.13"
          - runner: macos-15-intel
            arch: x86_64
            python: "3.10"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release -o dist --manifest-path crates/mpedb-py/Cargo.toml
      - name: the suite against the wheel that is about to upload
        run: |
          set -e
          pip install --find-links dist --no-index mpedb
          d=$(mktemp -d)
          python crates/mpedb-py/pytest/test_mpedb.py "$d"
          python crates/mpedb-py/pytest/test_mpedb.py "$d"
          python crates/mpedb-py/pytest/test_sync.py "$(mktemp -d)"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-macos-${{ matrix.arch }}
          path: dist

  sdist:
    needs: [version, pysuite, test]
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: -o dist --manifest-path crates/mpedb-py/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  publish:
    needs: [wheel-linux, wheel-macos, wheel-windows, sdist]
    runs-on: ubuntu-latest
    steps:
      # Only the release artifacts — `pysuite-wheel` (the every-push test
      # build, not manylinux-audited) must never reach twine.
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          pip install --quiet twine
          twine upload --skip-existing dist/*
